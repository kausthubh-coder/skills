name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Oracle regression tests
        run: bash skills/oracle/tests/oracle_scripts_test.sh
      - name: Test skills CLI package
        run: bash tests/skills_cli_smoke.sh
