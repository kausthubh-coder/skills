interface:
  display_name: "Oracle"
  short_description: "Initialize, plan, or implement with real parallel thread loops and evidence"
  default_prompt: "Use $oracle with one command: init, plan, or implement. Keep all Oracle project material under one structured .artifacts workspace, including human.html, test.md, plans, designs/workbench, examples, conclusions, and sandbox worktrees. For substantial implementation, make this thread the orchestrator, split independent features into isolated worktree lanes, and run each lane through fresh implementation, .artifacts/test.md testing, and independent review/scoring tasks. Run independent lanes concurrently, repeat failed lanes with fresh tasks, then integrate and run final regression plus review. Create polished, dated, evidence-backed HTML artifacts with useful diagrams, timelines, comparisons, or matrices when those communicate the work more clearly."
